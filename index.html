<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JS - Tabs</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="tabs">
            <div class="tab-header">
                <div class="active" id="tab1">Useless Facts</div>
                <div id="tab2">Cat Facts</div>
                <div id="tab3">Pokemon Facts</div>
            </div>
            <div class="tab-content">
                <div class="active" id="uselessContent">Content Loading...</div>
                <div id="catContent">Content Loading...</div>
                <div id="pokemonContent">Content Loading...</div>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
